name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v '\.g\.dart$')
      - name: Check generated Drift code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - run: flutter analyze
      - run: flutter test --coverage

  build:
    name: Build ${{ matrix.target }}
    needs: analyze-and-test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apk, os: ubuntu-latest, args: --debug }
          # Web is not supported yet (drift uses dart:ffi), see #30. Remove continue-on-error once fixed.
          - { target: web, os: ubuntu-latest, args: '', experimental: true }
          - { target: linux, os: ubuntu-latest, args: --debug }
          - { target: windows, os: windows-latest, args: --debug }
          - { target: macos, os: macos-latest, args: --debug }
          - { target: ios, os: macos-latest, args: --debug --no-codesign }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} ${{ matrix.args }}
