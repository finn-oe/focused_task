name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in sync with CLAUDE.md and README.md.
  FLUTTER_VERSION: 3.50.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' 'integration_test/*.dart' | grep -v -e '\.g\.dart$' -e '^lib/l10n/generated/')
      - name: Check generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
          test -z "$(git status --porcelain -- lib/l10n)"
      - name: Check generated Drift code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Check web database files match the locked drift / sqlite3 versions
        run: |
          dart compile js -O4 --no-source-maps tool/drift_worker.dart -o web/drift_worker.js
          rm -f web/drift_worker.js.deps
          git diff --exit-code -- web/drift_worker.js
          SQLITE3_VERSION=$(awk '/^  sqlite3:$/{f=1} f&&/version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)
          curl -sSfL -o /tmp/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${SQLITE3_VERSION}/sqlite3.wasm"
          cmp /tmp/sqlite3.wasm web/sqlite3.wasm
      - run: flutter analyze
      - run: flutter test --coverage

  integration-test:
    name: Integration tests (Linux)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: xvfb-run flutter test integration_test -d linux

  build:
    name: Build ${{ matrix.target }}
    needs: analyze-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apk, os: ubuntu-latest, args: --debug }
          - { target: web, os: ubuntu-latest, args: '' }
          - { target: linux, os: ubuntu-latest, args: --debug }
          - { target: windows, os: windows-latest, args: --debug }
          - { target: macos, os: macos-latest, args: --debug }
          - { target: ios, os: macos-latest, args: --debug --no-codesign }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} ${{ matrix.args }}
